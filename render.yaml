services:
  # 1. FastAPI Backend (Web Service)
  - type: web
    name: ai-kbg-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "*" # Change this to your frontend URL later for security
      # These must be set manually in the Render dashboard for security:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # 2. Vite Frontend (Static Site)
  - type: web
    name: vidzai-digital
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        # This will need to be your backend's public URL (e.g., https://vidzai-digital.onrender.com)
        sync: false
